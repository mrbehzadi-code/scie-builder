<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اکتشاف | اطلس اردکان</title><style>body{margin:0;background:#f5f7fb;color:#162033;font-family:Tahoma,"Segoe UI",Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top a{color:#315efb;text-decoration:none}.search{width:100%;box-sizing:border-box;padding:15px;border:1px solid #e5e9f0;border-radius:14px;font:inherit;background:#fff;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:19px;box-shadow:0 8px 24px rgba(22,32,51,.05)}.name{font-weight:800;font-size:17px}.meta{color:#687386;font-size:13px;line-height:1.8;margin-top:7px}.pill{display:inline-block;background:#eef2ff;color:#3b4f9b;border-radius:999px;padding:5px 8px;font-size:11px;margin:7px 4px 0 0}.open{display:inline-block;margin-top:12px;color:#315efb;text-decoration:none;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><h1>اکتشاف ظرفیت‌ها</h1><a href="./index.html">← داشبورد</a></div><input id="q" class="search" placeholder="نام، تخصص، نهاد یا حوزه را جست‌وجو کنید..."><section id="list" class="grid"><div>در حال دریافت داده...</div></section></main><script>const list=document.getElementById('list'),q=document.getElementById('q');let people=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(a){list.innerHTML=a.length?a.map((p,i)=>`<article class="card"><div class="name">${esc(p.name||'بدون نام')}</div><div class="meta">${esc(p.detail||'')}<br>${esc(p.location||'')} · ${esc(p.source||'')}</div><div>${(p.evidence||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><a class="open" href="./profile.html?id=${encodeURIComponent(p.id||p.name||i)}">مشاهده پرونده ←</a></article>`).join(''):'<div>رکوردی پیدا نشد.</div>'}async function init(){const d=await(await fetch('./data.json?t='+Date.now())).json();people=d.people||[];render(people)}q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();render(s?people.filter(p=>JSON.stringify(p).toLowerCase().includes(s)):people)});init().catch(()=>list.innerHTML='<div>دریافت داده با خطا مواجه شد.</div>');</script></body></html>
