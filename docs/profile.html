<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پروفایل ظرفیت | اطلس اردکان</title><style>body{margin:0;background:#f5f7fb;color:#162033;font-family:Tahoma,"Segoe UI",Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 18px}.back{display:inline-block;margin-bottom:18px;color:#315efb;text-decoration:none}.panel{background:#fff;border:1px solid #e5e9f0;border-radius:22px;padding:28px;box-shadow:0 12px 32px rgba(22,32,51,.07)}h1{margin:0 0 8px}.muted{color:#687386;line-height:1.9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.box{border:1px solid #e5e9f0;border-radius:16px;padding:16px}.box h3{margin:0 0 8px;font-size:14px}.pill{display:inline-block;background:#eef2ff;color:#3b4f9b;border-radius:999px;padding:6px 9px;font-size:12px;margin:4px}.source{margin-top:20px}.source a{color:#315efb}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><a class="back" href="./index.html">← بازگشت به اطلس</a><section class="panel" id="app"><div class="muted">در حال دریافت پروفایل...</div></section></main>
<script>
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function run(){try{const d=await (await fetch('./data.json?t='+Date.now())).json();const id=new URLSearchParams(location.search).get('id');const p=(d.people||[]).find(x=>String(x.id||x.name)===id);if(!p){app.innerHTML='<h1>پروفایل پیدا نشد</h1><p class="muted">این رکورد در Snapshot عمومی موجود نیست.</p>';return}app.innerHTML=`<div><div class="muted">${esc(p.type||'موجودیت')} · ${esc(p.source||'منبع نامشخص')}</div><h1>${esc(p.name||'بدون نام')}</h1><p class="muted">${esc(p.detail||'اطلاعات تکمیلی برای این رکورد ثبت نشده است.')}</p></div><div class="grid"><div class="box"><h3>ارتباط منطقه‌ای</h3><p>${esc(p.location||'در داده فعلی ثبت نشده')}</p></div><div class="box"><h3>سطح اطمینان</h3><p>${esc(p.status||'نیازمند بررسی')}</p></div></div><div class="box" style="margin-top:14px"><h3>شواهد</h3>${(p.evidence||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')||'<span class="muted">شاهد ثبت نشده</span>'}</div><div class="source">${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">مشاهده منبع اصلی ↗</a>`:'منبع مستقیم برای این رکورد ثبت نشده است.'}</div>`}catch(e){app.innerHTML='<h1>خطا در دریافت داده</h1><p class="muted">Snapshot در دسترس نیست.</p>'}}run();
</script></body></html>
