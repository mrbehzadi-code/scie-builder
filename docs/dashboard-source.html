<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اطلس سرمایه‌های اجتماعی اردکان</title><style>body{margin:0;background:#f4f6fa;color:#182235;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.box{background:#fff;border:1px solid #e2e6ee;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #0000000a}.top{display:flex;gap:15px;align-items:center}.title{font-size:27px;margin:5px 0}.muted{color:#667085}.search{display:flex;gap:8px;margin-top:15px}.input,.btn,.select{font:inherit;border:1px solid #dfe4ec;border-radius:10px;padding:11px;background:#fff}.input{flex:1}.btn{cursor:pointer}.primary{background:#315efb;color:#fff;border-color:#315efb}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.nav button{font:inherit;padding:10px 13px;border:1px solid #dfe4ec;background:#fff;border-radius:10px;cursor:pointer}.nav .active{background:#eef2ff;color:#315efb;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{padding:14px;border:1px solid #e2e6ee;border-radius:14px;background:#fff}.big{font-size:24px;font-weight:900}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar h2{flex:1}.person{padding:14px 4px;border-bottom:1px solid #e7eaf0;cursor:pointer}.person:hover{background:#f8faff}.head{display:flex;align-items:center;gap:8px}.no{display:inline-flex;min-width:34px;height:34px;align-items:center;justify-content:center;border-radius:9px;background:#eef2ff;color:#315efb;font-weight:900}.name{font-weight:800;flex:1}.tag{font-size:10px;background:#f1f3f7;padding:5px 8px;border-radius:999px}.meta{font-size:12px;line-height:1.9}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{font:inherit;font-size:11px;border:1px solid #dfe4ec;background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer}.chip.active{background:#eef2ff;color:#315efb}.pages{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:15px}.hidden{display:none}.error{padding:15px;background:#fff5f5;color:#9b2c2c;border-radius:12px}.leadrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.leadrow textarea{min-height:90px}.history{margin-top:10px;border:1px solid #e2e6ee;border-radius:12px;overflow:hidden}.hist{padding:9px;border-bottom:1px solid #e2e6ee;cursor:pointer}@media(max-width:650px){.metrics{grid-template-columns:1fr 1fr}.search{display:block}.search .btn{width:100%;margin-top:7px}.leadrow{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="box"><div class="top"><div><div style="color:#315efb;font-size:11px;font-weight:800">SCIE · Social Capital Intelligence Engine</div><h1 class="title">اطلس سرمایه‌های اجتماعی اردکان</h1><div class="muted">کشف ظرفیت‌های انسانی، علمی، حرفه‌ای و اجتماعی مرتبط با اردکان</div></div><span id="state" class="muted">در حال دریافت داده...</span></div><form id="search" class="search"><input id="q" class="input" placeholder="نام، فامیلی، تخصص، سازمان، مکان یا کلیدواژه"><button class="btn primary">جست‌وجو</button></form><div id="history"></div></section><nav class="nav"><button class="active" data-tab="people">👥 افراد</button><button data-tab="intelligence">🧠 هوش اطلس</button><button data-tab="organizations">🏢 سازمان‌ها</button><button data-tab="leads">🧩 سرنخ جدید</button></nav><section id="metrics" class="metrics"></section><section id="people" class="box"><div class="toolbar"><h2>افراد و ظرفیت‌های کشف‌شده</h2><select id="source" class="select"><option value="all">همه منابع</option></select></div><div id="cats" class="chips"></div><div id="count" class="meta">در حال دریافت...</div><div id="list"></div><div class="pages"><button id="prev" class="btn">قبلی</button><span id="pageinfo" class="meta">—</span><button id="next" class="btn">بعدی</button></div></section><section id="intelligence" class="box hidden"><h2>🧠 هوش اطلس</h2><div id="intel"></div></section><section id="organizations" class="box hidden"><h2>🏢 سازمان‌ها</h2><div id="orgs"></div></section><section id="leads" class="box hidden"><h2>🧩 سرنخ انسانی</h2><div class="leadrow"><select id="lt" class="select"><option>نام یا فرد</option><option>فامیلی</option><option>نشانی / محله</option><option>سازمان / شرکت</option><option>تخصص / حوزه</option><option>سرنخ آزاد</option></select><input id="lv" class="input" placeholder="مقدار سرنخ"><input id="ll" class="input" placeholder="مکان مرتبط"><textarea id="ln" class="input" placeholder="توضیحات"></textarea></div><p><button id="save" class="btn primary">ذخیره سرنخ</button><button id="export" class="btn">دریافت JSON</button></p><div id="leadHistory" class="history"></div></section><p class="muted" style="text-align:center;font-size:10px">رکوردها کاندیدا هستند، نه هویت‌های تأییدشده.</p></main><script>
const PAGE=25;let people=[],filtered=[],page=1,q='',src='all',cat='all',snap={};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){let err='';for(const u of [new URL('data.json',location.href).href,'https://raw.githubusercontent.com/mrbehzadi-code/scie-builder/main/docs/data.json?x='+Date.now()]){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);snap=await r.json();people=Array.isArray(snap.people)?snap.people:Array.isArray(snap.records)?snap.records:Array.isArray(snap)?snap:[];if(!people.length)throw Error('Snapshot has no people');return}catch(e){err=e.message}}throw Error(err||'data unavailable')}
function render(){filtered=people.filter(p=>(!q||JSON.stringify(p).toLowerCase().includes(q.toLowerCase()))&&(src==='all'||p.source===src)&&(cat==='all'||p.type===cat));let pages=Math.max(1,Math.ceil(filtered.length/PAGE));page=Math.min(page,pages);let start=(page-1)*PAGE,rows=filtered.slice(start,start+PAGE);$('count').textContent=filtered.length+' رکورد';$('pageinfo').textContent='صفحه '+page+' از '+pages;$('prev').disabled=page===1;$('next').disabled=page===pages;$('list').innerHTML=rows.length?rows.map((p,i)=>'<div class="person" data-i="'+(start+i)+'"><div class="head"><span class="no">'+(start+i+1)+'</span><span class="name">'+esc(p.name||'بدون نام')+'</span><span class="tag">'+esc(p.type||'کاندیدا')+'</span></div><div class="meta">'+esc(p.detail||'')+(p.location?' · '+esc(p.location):'')+'</div><div class="chips">'+(p.evidence||[]).map(e=>'<span class="chip">'+esc(e)+'</span>').join('')+'</div></div>').join(''):'<div class="error">رکوردی پیدا نشد.</div>';document.querySelectorAll('.person').forEach(x=>x.onclick=()=>alert((filtered[+x.dataset.i].name||'')+'\n'+(filtered[+x.dataset.i].detail||''))}
function setup(){let ss=[...new Set(people.map(p=>p.source).filter(Boolean))];$('source').innerHTML='<option value="all">همه منابع</option>'+ss.map(x=>'<option>'+esc(x)+'</option>').join('');let cs=[...new Set(people.map(p=>p.type).filter(Boolean))];$('cats').innerHTML='<button class="chip active" data-c="all">همه</button>'+cs.map(x=>'<button class="chip" data-c="'+esc(x)+'">'+esc(x)+'</button>').join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.classList.remove('active'));b.classList.add('active');page=1;render()});$('source').onchange=e=>{src=e.target.value;page=1;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('search').onsubmit=e=>{e.preventDefault();q=$('q').value.trim();let h=JSON.parse(localStorage.getItem('scie_search_history')||'[]').filter(x=>x!==q);if(q)h.unshift(q);localStorage.setItem('scie_search_history',JSON.stringify(h.slice(0,20)));page=1;render();showHistory()};showHistory()}
function showHistory(){let h=JSON.parse(localStorage.getItem('scie_search_history')||'[]');$('history').innerHTML=h.length?'<div class="history">'+h.map(x=>'<div class="hist">'+esc(x)+'</div>').join('')+'</div>':'';document.querySelectorAll('#history .hist').forEach(x=>x.onclick=()=>{$('q').value=x.textContent;q=x.textContent;page=1;render()})}
function leads(){const key='scie_leads';const read=()=>JSON.parse(localStorage.getItem(key)||'[]');const draw=()=>{$('leadHistory').innerHTML=read().map(x=>'<div class="hist">'+esc(x.type)+' · '+esc(x.value)+' · '+esc(x.location)+'</div>').join('')||'<div class="muted" style="padding:10px">هنوز سرنخی ثبت نشده است.</div>'};$('save').onclick=()=>{let a=read();a.unshift({type:$('lt').value,value:$('lv').value.trim(),location:$('ll').value.trim(),note:$('ln').value.trim(),at:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(a.slice(0,100)));draw()};$('export').onclick=()=>{let b=new Blob([JSON.stringify(read(),null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='scie-leads.json';a.click();URL.revokeObjectURL(u)};draw()}
(async()=>{try{await load();$('state').textContent='Snapshot فعال · '+people.length+' رکورد';$('metrics').innerHTML='<div class="metric"><div class="big">'+people.length+'</div><div>کاندیداها</div></div><div class="metric"><div class="big">'+(snap.stats?.academic_candidates??'—')+'</div><div>کاندیدای پژوهشی</div></div><div class="metric"><div class="big">'+(snap.stats?.regional_evidence??'—')+'</div><div>شواهد منطقه‌ای</div></div><div class="metric"><div class="big">'+Object.keys(snap.stats?.sources||{}).length+'</div><div>منبع</div></div>';setup();leads();render()}catch(e){$('state').textContent='خطا';$('list').innerHTML='<div class="error">بارگذاری Snapshot شکست خورد: '+esc(e.message)+'</div>'}})();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('section.box').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden')});
</script></body></html>
