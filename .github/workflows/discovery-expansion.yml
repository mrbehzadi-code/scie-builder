name: SCIE Discovery Expansion

on:
  push:
    branches: [main, 'sprint/**']
    paths-ignore:
      - 'docs/data.json'
  workflow_dispatch:

concurrency:
  group: scie-data-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Expand candidate pool
        run: python engines/discovery_expansion.py

      - name: Commit snapshot
        run: |
          git config user.name "scie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then echo "No snapshot changes"; exit 0; fi
          git commit -m "data: refresh discovery candidate pool"
          git pull --rebase origin main
          git push
