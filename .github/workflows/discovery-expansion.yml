name: SCIE Discovery Expansion

on:
  schedule:
    - cron: '20 2 * * 2,5'
  push:
    branches: [main, 'sprint/**']
    paths:
      - 'engines/discovery_expansion.py'
      - 'engines/public_source_discovery.py'
      - 'engines/social_source_discovery.py'
      - 'discovery_sources.json'
      - 'outputs/academic_candidates.json'
      - 'docs/web_candidates.json'
      - 'docs/web_candidates_extended.json'
      - 'academic_search_config.json'
      - 'discovery_config.json'
      - '.github/workflows/discovery-expansion.yml'
  workflow_dispatch:

concurrency:
  group: scie-data-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Expand candidate pool
        run: |
          echo "Starting public-source discovery toward the 5000-record target"
          python engines/discovery_expansion.py
          python engines/public_source_discovery.py
          python engines/social_source_discovery.py
          python engine/locality_scoring.py

      - name: Commit snapshot
        run: |
          git config user.name "scie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/locality_assessment.json docs/public_discovery_report.json docs/social_discovery_report.json
          if git diff --cached --quiet; then echo "No snapshot changes"; exit 0; fi
          git commit -m "data: refresh discovery candidate pool"
          git pull --rebase origin main
          git push
