name: Deploy public dashboard

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate canonical dashboard and snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          data = json.loads(Path('docs/data.json').read_text(encoding='utf-8'))
          intelligence = json.loads(Path('docs/intelligence.json').read_text(encoding='utf-8'))
          entities = json.loads(Path('docs/entities.json').read_text(encoding='utf-8'))
          knowledge_graph = json.loads(Path('docs/knowledge_graph.json').read_text(encoding='utf-8'))
          people = data.get('people', [])
          if not people:
              raise SystemExit('Refusing deployment: docs/data.json contains no people')
          unnamed = [i + 1 for i, x in enumerate(people) if not isinstance(x, dict) or not str(x.get('name','')).strip()]
          if unnamed:
              raise SystemExit(f'Refusing deployment: unnamed records {unnamed[:10]}')
          if intelligence.get('candidate_count') != len(people):
              raise SystemExit('Refusing deployment: intelligence/data candidate counts differ')
          if intelligence.get('generated_at') != data.get('generated_at'):
              raise SystemExit('Refusing deployment: intelligence/data snapshot dates differ')
          canonical_count = entities.get('metrics', {}).get('canonical_entities')
          graph_metrics = knowledge_graph.get('metrics', {})
          if graph_metrics.get('canonical_entity_count') != canonical_count:
              raise SystemExit('Refusing deployment: knowledge graph/canonical entity counts differ')
          if graph_metrics.get('connected_entities') != canonical_count:
              raise SystemExit('Refusing deployment: not all canonical entities are connected in graph')
          if graph_metrics.get('nodes', 0) <= canonical_count or graph_metrics.get('edges', 0) <= 0:
              raise SystemExit('Refusing deployment: knowledge graph is empty or incomplete')
          html = Path('docs/index.html').read_text(encoding='utf-8')
          required = [
              'async function loadData()',
              'function render()',
              'function buildMetrics()',
              'function buildIntel()',
              'function buildOrgs()',
              'function leads()',
              'data.json',
              'intelligence',
              'id="list"',
              'class="no"',
              'SCIE_UX_V3_RECORD_NUMBERING',
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('Refusing deployment: missing canonical dashboard components: ' + ', '.join(missing))
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('Refusing deployment: no inline dashboard script found')
          Path('/tmp/dashboard.js').write_text('\n'.join(scripts), encoding='utf-8')
          print(f'Validated canonical dashboard: {len(people)} named records')
          print(f'Snapshot: {data["generated_at"]}')
          PY
          node --check /tmp/dashboard.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install browser smoke-test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify deployed dashboard in Chromium
        env:
          DASHBOARD_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const consoleErrors = [];
            const failedRequests = [];
            let dataStatus = null;
            let intelligenceStatus = null;
            let entityResolutionStatus = null;
            let profileEnrichmentStatus = null;
            let entitiesStatus = null;
            let knowledgeGraphStatus = null;

            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('requestfailed', request => {
              failedRequests.push(request.url() + ': ' + request.failure()?.errorText);
            });
            page.on('response', response => {
              if (/\/data\.json(?:\?|$)/.test(response.url())) dataStatus = response.status();
              if (/\/intelligence\.json(?:\?|$)/.test(response.url())) intelligenceStatus = response.status();
              if (/\/entity_resolution\.json(?:\?|$)/.test(response.url())) entityResolutionStatus = response.status();
              if (/\/profile_enrichment\.json(?:\?|$)/.test(response.url())) profileEnrichmentStatus = response.status();
              if (/\/entities\.json(?:\?|$)/.test(response.url())) entitiesStatus = response.status();
              if (/\/knowledge_graph\.json(?:\?|$)/.test(response.url())) knowledgeGraphStatus = response.status();
            });

            let loaded = false;
            for (let attempt = 1; attempt <= 12; attempt++) {
              const url = `${process.env.DASHBOARD_URL}?v=${process.env.GITHUB_SHA}-${attempt}`;
              await page.goto(url, { waitUntil: 'domcontentloaded' });
              try {
                await page.waitForSelector('#list .person', { timeout: 10000 });
                loaded = true;
                break;
              } catch (error) {
                const state = await page.locator('#state').textContent().catch(() => 'missing #state');
                const count = await page.locator('#count').textContent().catch(() => 'missing #count');
                const listText = await page.locator('#list').textContent().catch(() => 'missing #list');
                console.log(`Attempt ${attempt}: dashboard not ready; state=${state}; count=${count}; dataStatus=${dataStatus}; list=${listText}`);
                console.log('Recent console errors:', consoleErrors.slice(-5));
                console.log('Recent failed requests:', failedRequests.slice(-5));
                await page.waitForTimeout(5000);
              }
            }
            if (!loaded) throw new Error('Dashboard never rendered person records after deploy propagation retries');

            const snapshotCount = await page.locator('#list .person').count();
            if (snapshotCount !== 25) throw new Error(`Expected 25 records on page 1, got ${snapshotCount}`);
            if (dataStatus !== 200) throw new Error(`data.json returned HTTP ${dataStatus}`);
            if (intelligenceStatus !== 200) throw new Error(`intelligence.json returned HTTP ${intelligenceStatus}`);
            if (entityResolutionStatus !== 200) throw new Error(`entity_resolution.json returned HTTP ${entityResolutionStatus}`);
            if (profileEnrichmentStatus !== 200) throw new Error(`profile_enrichment.json returned HTTP ${profileEnrichmentStatus}`);
            if (entitiesStatus !== 200) throw new Error(`entities.json returned HTTP ${entitiesStatus}`);
            if (knowledgeGraphStatus !== 200) throw new Error(`knowledge_graph.json returned HTTP ${knowledgeGraphStatus}`);

            const qualityBadge = (await page.locator('#list .person .quality').first().textContent()).trim();
            if (!/^کیفیت \d+$/.test(qualityBadge)) throw new Error(`Quality badge missing or invalid: ${qualityBadge}`);
            const profileBadge = (await page.locator('#list .person .complete').first().textContent()).trim();
            if (!/^پروفایل \d+٪$/.test(profileBadge)) throw new Error(`Profile badge missing or invalid: ${profileBadge}`);

            const firstName = (await page.locator('#list .person .name').first().textContent()).trim();
            if (!firstName || firstName === 'بدون نام') throw new Error('First record has no real name');

            await page.click('#next');
            const pageTwoNumber = (await page.locator('#list .person .no').first().textContent()).trim();
            if (pageTwoNumber !== '26') throw new Error(`Page 2 starts at ${pageTwoNumber}, expected 26`);

            await page.fill('#q', 'A Firozabadi Ardakan');
            await page.locator('#search').evaluate(form => form.requestSubmit());
            await page.waitForFunction(() => document.querySelectorAll('#list .person').length === 1);
            const searchName = (await page.locator('#list .person .name').first().textContent()).trim();
            if (searchName !== 'A Firozabadi Ardakan') throw new Error(`Search returned ${searchName}`);

            await page.click('#reset');
            const beforeFilter = Number((await page.locator('#count').textContent()).match(/\d+/)?.[0]);
            await page.selectOption('#source', 'GitHub Discovery');
            const afterFilter = Number((await page.locator('#count').textContent()).match(/\d+/)?.[0]);
            if (!(afterFilter > 0 && afterFilter < beforeFilter)) {
              throw new Error(`Source filter did not narrow results: ${beforeFilter} -> ${afterFilter}`);
            }

            await page.locator('#list .person').first().click();
            if (!(await page.locator('#detail').isVisible())) throw new Error('Detail view did not open');
            const detailText = await page.locator('#dmeta').textContent();
            if (!detailText.includes('کیفیت شواهد')) throw new Error('Detail view is missing quality evidence');
            if (!detailText.includes('کامل بودن پروفایل') || !detailText.includes('OpenAlex ID')) throw new Error('Detail view is missing profile enrichment');
            if (!detailText.includes('Entity ID')) throw new Error('Detail view is missing canonical entity id');
            await page.click('#close');

            await page.click('[data-tab="intelligence"]');
            const intelText = await page.locator('#intelligence').textContent();
            if (!intelText.includes('کیفیت قوی') || !intelText.includes('تکرارهای احتمالی نیازمند بررسی') || !intelText.includes('دارای سازمان') || !intelText.includes('دارای مکان')) {
              throw new Error('Intelligence quality/duplicate section is missing');
            }
            const canonicalRows = await page.locator('#canonical .entityrow').count();
            if (canonicalRows !== 3) throw new Error(`Expected 3 multi-record canonical entities, got ${canonicalRows}`);
            const duplicateRows = await page.locator('#dupes .dup').count();
            if (duplicateRows < 1) throw new Error('Expected at least one duplicate-review row');
            const resolutionRows = await page.locator('#resolutions .resolution').count();
            if (resolutionRows < 17) throw new Error(`Expected at least 17 entity-resolution rows, got ${resolutionRows}`);
            const resolutionText = await page.locator('#resolutions').textContent();
            if (!resolutionText.includes('LIKELY_SAME_PERSON') || !resolutionText.includes('UNCERTAIN')) {
              throw new Error('Entity-resolution decisions are missing from the dashboard');
            }

            const seriousConsoleErrors = consoleErrors.filter(x => !/favicon/i.test(x));
            const snapshotFailures = failedRequests.filter(x => /data\.json|intelligence\.json/.test(x));
            if (seriousConsoleErrors.length) throw new Error('Console errors: ' + seriousConsoleErrors.join(' | '));
            if (snapshotFailures.length) throw new Error('Snapshot request failures: ' + snapshotFailures.join(' | '));

            console.log(JSON.stringify({
              dashboard: process.env.DASHBOARD_URL,
              dataStatus,
              intelligenceStatus,
              entityResolutionStatus,
              profileEnrichmentStatus,
              entitiesStatus,
              knowledgeGraphStatus,
              qualityBadge,
              profileBadge,
              pageOneRecords: snapshotCount,
              firstName,
              pageTwoStartsAt: pageTwoNumber,
              searchName,
              sourceFilter: { before: beforeFilter, after: afterFilter },
              detailOpened: true,
              canonicalRows,
              duplicateRows,
              resolutionRows,
              consoleErrors: seriousConsoleErrors.length,
              snapshotRequestFailures: snapshotFailures.length
            }, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
