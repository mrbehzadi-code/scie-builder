name: Deploy public dashboard

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate dashboard data
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          data = json.loads(Path('docs/data.json').read_text(encoding='utf-8'))
          people = data.get('people', [])
          if not people:
              raise SystemExit('Refusing deployment: docs/data.json contains no people')
          unnamed = [i + 1 for i, x in enumerate(people) if not isinstance(x, dict) or not str(x.get('name','')).strip()]
          if unnamed:
              raise SystemExit(f'Refusing deployment: unnamed records {unnamed[:10]}')
          html = Path('docs/index.html').read_text(encoding='utf-8')
          required = ['loadData','function render','data.json','id="list"','class="no"']
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('Refusing deployment: missing dashboard components: ' + ', '.join(missing))
          print(f'Validated dashboard: {len(people)} named records')
          print(f'First record: {people[0]["name"]}')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
