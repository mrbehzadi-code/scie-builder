name: SCIE Intelligence Layer

on:
  push:
    branches: [main]
    paths:
      - 'docs/data.json'
      - 'engine/intelligence.py'
      - '.github/workflows/intelligence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build intelligence layer
        run: python engine/intelligence.py

      - name: Commit intelligence snapshot
        run: |
          git config user.name 'scie-bot'
          git config user.email 'scie-bot@users.noreply.github.com'
          git add docs/intelligence.json
          if git diff --cached --quiet; then
            echo 'No intelligence changes.'
          else
            git commit -m 'Update intelligence layer'
            git push
          fi
