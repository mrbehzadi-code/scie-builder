name: SCIE Intelligence Layer

on:
  push:
    branches: [main]
    paths:
      - 'docs/data.json'
      - 'engine/intelligence.py'
      - '.github/workflows/intelligence.yml'
  workflow_run:
    workflows: ["SCIE Discovery Expansion", "SCIE Lead Guided Discovery"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build intelligence layer
        run: python engine/intelligence.py

      - name: Repair dashboard data loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          old_loader = "async function loadJSON(path){const url=new URL(path,location.href);url.searchParams.set('v',Date.now());const r=await fetch(url.href,{cache:'no-store'});if(!r.ok)throw new Error(`${path}: HTTP ${r.status}`);return await r.json()}"
          new_loader = """async function loadJSON(path){const urls=[new URL(path,location.href),new URL('https://raw.githubusercontent.com/mrbehzadi-code/scie-builder/main/docs/'+path)];const errors=[];for(const u of urls){try{u.searchParams.set('v',Date.now());const r=await fetch(u.href,{cache:'no-store'});if(r.ok)return await r.json();errors.push(`${u.href}: HTTP ${r.status}`)}catch(e){errors.push(`${u.href}: ${e.message}`)}}throw new Error(errors.join(' | '))}"""
          if old_loader in s:
              s=s.replace(old_loader,new_loader)
          old_boot = "async function boot(){try{const[d,i]=await Promise.all([loadJSON('data.json'),loadJSON('intelligence.json')]);if(!d||!Array.isArray(d.people))throw new Error('ساختار data.json معتبر نیست');DATA=d;INT=i||{};all=d.people;buildOverview();buildFilters();renderPeople();renderIntelligence();renderOrganizations();renderSearchHistory();renderLeadHistory();$('loadState').textContent=`Snapshot آماده · ${all.length} رکورد`;$('loadState').style.background='#eaf8f1';$('loadState').style.color='var(--ok)'}catch(err){console.error(err);$('loadState').textContent='خطا در دریافت Snapshot';$('loadState').style.background='#fff1f1';$('loadState').style.color='#9b2c2c';$('list').innerHTML=`<div class=\"error\"><b>Dashboard نتوانست Snapshot را بخواند.</b><br><span class=\"meta\">${esc(err.message)}</span><br><button class=\"btn\" style=\"margin-top:10px\" onclick=\"location.reload()\">تلاش دوباره</button></div>`;$('count').textContent='داده بارگذاری نشد'}}"
          new_boot = """async function boot(){try{const d=await loadJSON('data.json');if(!d||!Array.isArray(d.people))throw new Error('ساختار data.json معتبر نیست');DATA=d;all=d.people;buildOverview();buildFilters();renderPeople();renderSearchHistory();renderLeadHistory();$('loadState').textContent=`Snapshot آماده · ${all.length} رکورد`;$('loadState').style.background='#eaf8f1';$('loadState').style.color='var(--ok)';try{INT=await loadJSON('intelligence.json')}catch(e){INT={};console.warn('Intelligence layer unavailable:',e.message)}renderIntelligence();renderOrganizations()}catch(err){console.error(err);$('loadState').textContent='خطا در دریافت Snapshot';$('loadState').style.background='#fff1f1';$('loadState').style.color='#9b2c2c';$('list').innerHTML=`<div class=\"error\"><b>Dashboard نتوانست Snapshot را بخواند.</b><br><span class=\"meta\">${esc(err.message)}</span><br><button class=\"btn\" style=\"margin-top:10px\" onclick=\"location.reload()\">تلاش دوباره</button></div>`;$('count').textContent='داده بارگذاری نشد'}}"""
          if old_boot in s:
              s=s.replace(old_boot,new_boot)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit snapshots and dashboard repair
        run: |
          git config user.name 'scie-bot'
          git config user.email 'scie-bot@users.noreply.github.com'
          git add docs/intelligence.json docs/index.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'fix: make dashboard snapshot loading resilient'
            git pull --rebase origin main
            git push
          fi
