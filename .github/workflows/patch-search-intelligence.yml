name: SCIE Dashboard Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-search-intelligence.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard source
        run: |
          test -s docs/index.html
          grep -q 'id="list"' docs/index.html
          grep -q 'async function loadData' docs/index.html
          grep -q 'data.json' docs/index.html
          grep -q 'PAGE=25' docs/index.html
          echo 'Dashboard source validation passed.'
