name: Finalize dashboard artifact
on:
  workflow_run:
    workflows: ["Deploy public dashboard"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-finalize
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select deterministic dashboard
        run: cp docs/dashboard-source.html docs/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload final site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy final site
        id: deployment
        uses: actions/deploy-pages@v4
